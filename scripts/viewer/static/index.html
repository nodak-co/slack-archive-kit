<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>슬랙 보관함</title>
<style>
:root{--sk-gold:#FFC233;--sk-gray:#6b6b6b;--sk-line:#e5e5e5;--sk-ink:#1d1c1d}
*{box-sizing:border-box}body{margin:0;padding:18px 22px;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;background:#f6f5f2;color:var(--sk-ink)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.top h1{font-size:18px;margin:0}
.gs{margin-left:auto;display:flex;gap:6px}.gs input{width:min(280px,46vw);height:34px;border:1px solid var(--sk-line);border-radius:8px;padding:0 12px;font-size:14px}
.lo{font-size:13px;color:var(--sk-gray);text-decoration:none;white-space:nowrap}
.res{background:#fff;border:1px solid var(--sk-line);border-radius:12px;padding:6px 0;max-height:calc(100vh - 150px);overflow:auto}
.res a{display:block;padding:10px 18px;border-bottom:1px solid #f0f0f0;color:inherit;text-decoration:none}.res a:hover{background:#f8f8f8}
.res small{color:var(--sk-gray)}.res mark{background:#fff1b8}.res .x{display:flex;justify-content:space-between;padding:8px 18px;color:var(--sk-gray);font-size:14px}
.sk-emo{width:1.25em;height:1.25em;vertical-align:-.25em;object-fit:contain}
.sk-cn{justify-content:flex-start!important}.sk-ic{display:inline-flex;width:16px;justify-content:center;font-style:normal;opacity:.85;margin-right:6px;flex:none}.sk-bar b{display:inline-flex;align-items:center}
</style>
<link rel=stylesheet href=/slack.css?v=4>
<div class=top><h1 id=ttl>슬랙 보관함</h1><form class=gs id=gs><input id=gq type=search placeholder="전체 채널에서 찾기 (세 글자 이상이면 빨라요)"></form><a class=lo id=lo href=/logout hidden>로그아웃</a></div>
<p class=sk-sum id=sum>불러오는 중…</p>
<div class=res id=res hidden></div>
<div class=sk-app id=app>
  <aside class=sk-side id=side></aside>
  <section class=sk-chan id=chan></section>
  <section class=sk-thread id=thread></section>
</div>
<script src=/emoji-map.js?v=2></script>
<script src=/slack.js?v=9></script>
<script src=/search.js?v=1></script>
